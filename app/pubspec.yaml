name: carer_record_app
description: Mobile-first clinical record MVP.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: "3.47.7"

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  just_audio: ^0.9.4
  llamadart: ^0.11.1
  path_provider: ^2.1.4
  record: ^6.2.1
  sherpa_onnx: ^1.13.8
  supabase_flutter: ^2.8.4
  timezone: ^0.10.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/asr_model_manifest.json
    - assets/llm_model_manifest.json
