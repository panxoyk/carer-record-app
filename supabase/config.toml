project_id = "carer-record"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.carerrecord.app://login-callback", "io.carerrecord.app://login-callback/recover"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Keep the email/password provider available for existing accounts. Global
# auth.enable_signup above still prevents public account creation.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# The cloud synthesis function was retired by ADR-017: there is no Edge Function
# for synthesis anymore, and the model runs on the device.

[functions.create-practitioner]
verify_jwt = true

[functions.clinical-record]
verify_jwt = false

[analytics]
enabled = false
