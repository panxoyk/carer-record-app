# Servidor HAPI FHIR R4 de demostración para Carer Record. Solo desarrollo local.
# Datos exclusivamente sintéticos; nunca cargues datos clínicos reales.
#
#   pnpm app:run      inicia el flujo completo, incluido HAPI
#   pnpm fhir:down    detiene el contenedor; los datos viven en el volumen hapi-data
#
# Base FHIR: http://127.0.0.1:${HAPI_FHIR_PORT:-8080}/fhir
name: carer-record-fhir

services:
  hapi-data-permissions:
    # The pinned HAPI image runs as 65532:65532; new Docker volumes start root-owned.
    image: alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /volume"]
    volumes:
      - hapi-data:/volume
    restart: "no"
  hapi-fhir:
    # HAPI 8.12.0, validado con FHIR R4 v4.0.1.
    image: ${HAPI_FHIR_IMAGE:-hapiproject/hapi@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e}
    container_name: carer-record-hapi-fhir
    depends_on:
      hapi-data-permissions:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HAPI_FHIR_PORT:-8080}:8080"
    environment:
      # Límite de heap para el servidor local de demostración.
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"
      # Spring Boot externalized configuration; database files persist in hapi-data.
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/hapi/hapi;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - hapi-data:/data/hapi

volumes:
  hapi-data:
    name: carer-record-hapi-data
