# Servidor HAPI FHIR R4 de demostración para Carer Record. Solo desarrollo local.
# Datos exclusivamente sintéticos; nunca cargues datos clínicos reales.
#
#   pnpm fhir:up      levanta el servidor y carga los pacientes de demostración
#   pnpm fhir:down    detiene y elimina el contenedor (la base vive en memoria)
#
# Base FHIR: http://127.0.0.1:${HAPI_FHIR_PORT:-8080}/fhir
name: carer-record-fhir

services:
  hapi-fhir:
    # Fija HAPI_FHIR_TAG a una versión concreta cuando el equipo valide una.
    image: hapiproject/hapi:${HAPI_FHIR_TAG:-latest}
    container_name: carer-record-hapi-fhir
    ports:
      - "${HAPI_FHIR_PORT:-8080}:8080"
    environment:
      # El servidor por defecto reserva mucha memoria; con 10 pacientes sobra 1 GB.
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"

  # Tarea de un solo uso: espera a HAPI y carga docker/hapi-fhir/seed/demo-patients.json.
  # Es idempotente: si el paciente CRA-0101 ya existe, no vuelve a cargar nada.
  hapi-seed:
    image: curlimages/curl:8.11.1
    depends_on:
      - hapi-fhir
    restart: "no"
    volumes:
      - ./seed:/seed:ro
    environment:
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
    entrypoint: ["sh", "-c"]
    # `$$` evita que Compose interprete el signo de dólar: el contenedor ve `$`.
    command:
      - |
        set -eu
        echo "Esperando a HAPI FHIR en $$FHIR_BASE_URL ..."
        tries=0
        until [ "$$(curl -s -o /dev/null -w '%{http_code}' "$$FHIR_BASE_URL/metadata")" = "200" ]; do
          tries=$$((tries + 1))
          if [ "$$tries" -gt 120 ]; then
            echo "HAPI FHIR no respondió a tiempo." >&2
            exit 1
          fi
          sleep 5
        done
        existing="$$(curl -s "$$FHIR_BASE_URL/Patient?identifier=urn:carer-record:demo:mrn%7CCRA-0101&_summary=count")"
        if echo "$$existing" | grep -Eq '"total" *: *[1-9]'; then
          echo "Los pacientes de demostración ya estaban cargados."
          exit 0
        fi
        status="$$(curl -sS -o /tmp/seed-result.json -w '%{http_code}' \
          -X POST -H 'Content-Type: application/fhir+json' \
          --data-binary @/seed/demo-patients.json "$$FHIR_BASE_URL")"
        if [ "$$status" != "200" ] && [ "$$status" != "201" ]; then
          echo "La carga falló (HTTP $$status):" >&2
          cat /tmp/seed-result.json >&2
          exit 1
        fi
        echo "Pacientes de demostración cargados (HTTP $$status)."
